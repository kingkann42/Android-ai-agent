name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      
      - name: Extract Android app source
        run: unzip -q "AndroidAgent_v0.5.0_Source.zip" -d android-source

      - name: Build debug APK
        shell: bash
        run: |
          wrapper="$(find . -name gradlew -type f -not -path '*/node_modules/*' -print -quit)"
          if [[ -z "$wrapper" ]]; then
            echo "::error::No Gradle wrapper (gradlew) found."
            exit 1
          fi
          cd "$(dirname "$wrapper")"
          bash ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
