name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract Android app source
        run: unzip -q AndroidAgent_v0.5.0_Source.zip -d android-source
      - name: Fix accessibility service description
        working-directory: android-source/AndroidAgent_v0.5.0/app/src/main/res
        run: |
          mkdir -p values
          cat > values/accessibility_strings.xml <<'XML'
          <resources>
              <string name="accessibility_service_description">Allows explicitly approved, task-scoped UI actions in apps you allowlist.</string>
          </resources>
          XML

          sed -i 's|android:description="Allows explicitly approved, task-scoped UI actions in apps you allowlist\."|android:description="@string/accessibility_service_description"|' xml/accessibility_service_config.xml
          grep -F 'android:description="@string/accessibility_service_description"' xml/accessibility_service_config.xml

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
    

      - name: Upload replacement Kotlin file
        uses: actions/upload-artifact@v4
        with:
          name: MainActivity-source
          path: android-source/AndroidAgent_v0.5.0/app/src/main/java/com/example/androidagent/MainActivity.kt
          if-no-files-found: error

      - name: Build APK with installed Gradle
        working-directory: android-source/AndroidAgent_v0.5.0
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-source/AndroidAgent_v0.5.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error